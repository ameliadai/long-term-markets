<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Long-Horizon Prediction Markets</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<style>
.tipul{margin:0;padding-left:16px;line-height:1.45}.tipul li{margin:2px 0}
.pagetitle{font-size:22px;margin:8px 0 6px;font-weight:650;letter-spacing:-.01em}.lead{color:var(--text2);font-size:15px;line-height:1.55;max-width:820px;margin:0 0 18px}
.section{margin:34px 0 12px}.section h3{font-size:16px;margin:0 0 4px;font-weight:620}.section p{margin:0;color:var(--text2);max-width:820px;line-height:1.5}
.tagline{font-weight:400;color:var(--text2);font-size:13px;margin-left:10px}
.info{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;margin-left:7px;border:1px solid var(--muted);border-radius:50%;font:italic 600 10px/1 Georgia,serif;color:var(--text2);cursor:help;vertical-align:1px}.info:hover,.info:focus{background:var(--s1);border-color:var(--s1);color:#fff;outline:none}
.card h3 .info{margin-left:8px;vertical-align:2px}.card .sub{line-height:1.45}
.finding{display:flex;flex-direction:column;gap:6px}.finding p{margin:0;color:var(--text2);line-height:1.5}.finding a{font-size:13px}
ul.findings{max-width:820px;margin:8px 0 0;padding-left:20px;font-size:15px;line-height:1.6}ul.findings li{margin:0 0 12px}ul.findings a{font-size:13px;white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:6px;overflow:hidden}.seg button{border:0;border-radius:0;background:var(--surface);color:var(--text2)}.seg button.on{background:var(--s1);color:#fff}.grid.liq{grid-template-columns:repeat(auto-fit,minmax(min(440px,100%),1fr))}
.narrow{max-width:1100px}.narrow .grid,.narrow .grid.liq{grid-template-columns:repeat(auto-fit,minmax(min(420px,100%),1fr))}.narrow .grid.tc{grid-template-columns:minmax(0,1.9fr) minmax(280px,1fr);margin-bottom:16px}@media(max-width:860px){.narrow .grid.tc{grid-template-columns:1fr}}
.formula{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:4px 12px;margin:12px 0;overflow-x:auto;position:relative}.formula .katex-display{margin:.6em 0}.expl{margin:6px 0;color:var(--text2);line-height:1.55;max-width:900px}
.note{color:var(--text2);font-size:12px;line-height:1.5;margin-top:8px}
td.good{color:var(--good);font-weight:600}.have{white-space:nowrap;font-weight:600}.summary{font-size:15px;line-height:1.55;max-width:820px;margin:18px 0 0}td.bad{color:var(--bad)}.sig{font-weight:650}
ul.plain,ol.plain{margin:6px 0 0;padding-left:18px;color:var(--text2);line-height:1.55}ul.plain li,ol.plain li{margin:3px 0}
code.path{font:11px ui-monospace,Menlo,monospace;color:var(--muted)}
header nav{display:flex;flex-wrap:nowrap}header h1,header nav a{white-space:nowrap}header nav a{padding:6px 8px}@media(max-width:1560px){#hdr-note{display:none}}#hdr-note{margin-left:auto;white-space:nowrap}#plat-seg{margin-left:8px;flex-shrink:0}#plat-seg button{padding:4px 10px}@media(max-width:1700px){.tagline{display:none}}.tail th{white-space:normal;max-width:190px;vertical-align:bottom;line-height:1.3}
@media(max-width:700px){header{flex-wrap:wrap;gap:8px;padding:10px 16px}header nav{order:3;width:100%;overflow-x:auto}main{padding:16px}.grid,.narrow .grid,.narrow .grid.liq{grid-template-columns:1fr}.tagline{display:none}}
</style></head>
<body>
<header><h1>Long-horizon markets <span class="tagline">A first look at what the data can tell us</span></h1><nav><a href="#/overview">Overview</a><a href="#/horizons">Horizons</a><a href="#/accuracy">Accuracy</a><a href="#/regressions">Regression</a><a href="#/tail">Last days</a><a href="#/rewards">Rewards</a><a href="#/coverage">What we have</a><a href="#/data">Data</a><a href="#/notes">Notes</a></nav><div class="seg" id="plat-seg"></div><span id="hdr-note" class="muted small"></span></header>
<main id="main"><p class="muted">Loading…</p></main>
<div class="tooltip" id="tooltip"></div>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script><script src="charts.js"></script><script src="site.js"></script>
</body></html>
